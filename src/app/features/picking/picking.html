<ngx-scanner-qrcode>
  @for (item of items(); track $index) {
    <p>{{ item }}</p>
  }
</ngx-scanner-qrcode>
<h2>Picking List</h2>
<div class="picking-list">
  @for (item of items(); track $index) {
    <p class="picking-item">{{ item }}</p>
  }
</div>
<div>
  <p>Items: {{ items().length }}</p>
  <p>Total: ${{ total() / 100 }}</p>
</div>
