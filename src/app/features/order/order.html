<mat-dialog-content>
   <mat-list>
     @for (m of menu; track $index; let i = $index) {
      <div mat-subheader>{{ m.name }}</div>
      @for (item of m.items; track $index) {
        <app-order-item [name]="item.name" [qty]="qtyFor(item.name)"/>
      }
      <mat-divider />
     }
   </mat-list>
 </mat-dialog-content>
<mat-dialog-actions>
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-flat-button (click)="ok()">Ok</button>
</mat-dialog-actions>
